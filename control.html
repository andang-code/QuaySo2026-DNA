<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Panel</title>
  <link rel="stylesheet" href="./assets/control.css" />
  <script src="./assets/jquery.js"></script>
</head>

<body>
  <div class="button-container">
    <button id="Start" class="start-btn">BẮT ĐẦU</button>
    <button id="Reset">RESET</button>
  </div>

  <div class="input-container">
    <textarea id="ListInput" placeholder="Nhập danh sách dự thưởng (mỗi dòng 1 người)" rows="4"></textarea>
    <button id="ConfirmList">XÁC NHẬN DANH SÁCH</button>
    <button id="ClearList" type="button">XOÁ Ô</button>
  </div>

  <div class="bg-container">
    <div class="bg-title">Chọn background cho trang quay (index.html)</div>
    <div id="bgGrid" class="bg-grid"></div>
  </div>

  <main class="container">
    <section class="left-panel">
      <h2>Danh sách dự thưởng</h2>
      <table>
        <thead>
          <tr>
            <th>Số Thứ Tự</th>
            <th>Tên</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="right-panel">
      <h2>Danh sách trúng thưởng</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Số Thứ Tự</th>
              <th>Người trúng giải</th>
            </tr>
          </thead>
          <tbody id="spinHistory"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="input-container">
    <textarea id="InputField" placeholder="Nhập thông tin..." rows="2"></textarea>
    <button id="Confirm">XÁC NHẬN</button>

    <div class="clear-wrap">
      <button id="ClearPick" type="button">BỎ</button>

      <!-- ✅ icon ép trúng -->
      <button id="forcedIcon" type="button" title="Xem thông tin ép trúng" style="display:none;">ⓘ</button>
    </div>

    <div id="forcedNotice" style="display:none;"></div>
  </div>

  <!-- ✅ Popup xem trước background -->
  <div id="bgModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <div id="bgModalTitle" class="modal-title">Xem trước background</div>
        <button id="bgModalClose" class="modal-close" type="button">✕</button>
      </div>

      <video id="bgModalVideo" muted playsinline loop controls></video>

      <div class="modal-actions">
        <button id="bgApplyBtn" type="button" class="primary">DÙNG BACKGROUND NÀY</button>
        <button id="bgCancelBtn" type="button">ĐÓNG</button>
      </div>
    </div>
  </div>

  <!-- ✅ Popup thông tin ép trúng -->
  <div id="forcedInfoModal" class="mini-popover" style="display:none;">
    <div class="mini-title">Ép trúng đang chọn</div>
    <div id="forcedInfoText" class="mini-body"></div>
  </div>

  <script src="./assets/background/background_list.js"></script>
  <script src="./assets/control.js"></script>
</body>

</html>
